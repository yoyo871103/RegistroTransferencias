<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de licencias</title>
<!-- Plantilla. "node licencia.js" crea generador-licencias.html con el secreto
     dentro. Ese archivo NO se comparte ni va a GitHub. -->
<style>
  :root{--g50:#f8fafc;--g200:#e2e8f0;--g300:#cbd5e1;--g500:#64748b;--g800:#1e293b;
        --p50:#eef2ff;--p200:#c7d2fe;--p600:#4f46e5;--err:#e52e00}
  *{box-sizing:border-box}
  body{margin:0;background:var(--g50);color:var(--g800);font:14px/1.45 Inter,system-ui,Segoe UI,Roboto,sans-serif;
       display:flex;justify-content:center;padding:32px 16px}
  main{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:420px;
       box-shadow:rgba(145,158,171,.2) 0 0 2px 0,rgba(145,158,171,.12) 0 12px 24px -4px}
  h1{font-size:17px;margin:0 0 4px} p{color:var(--g500);margin:0 0 16px;font-size:13px}
  label{display:block;font-size:13px;font-weight:500;margin:0 0 4px}
  input{width:100%;height:40px;padding:0 12px;border:1px solid var(--g300);border-radius:8px;
        font:16px ui-monospace,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}
  input:focus{outline:none;border-color:var(--p600);box-shadow:0 0 0 3px rgb(99 102 241/.15)}
  .lic{margin-top:16px;padding:14px;border:1px solid var(--p200);background:var(--p50);border-radius:8px;
       display:none;align-items:center;gap:10px}
  .lic.on{display:flex}
  .lic b{flex:1;font:20px ui-monospace,Consolas,monospace;letter-spacing:.08em;user-select:all}
  button{height:36px;padding:0 14px;border:0;border-radius:8px;background:var(--p600);color:#fff;font-weight:500;cursor:pointer}
  .err{color:var(--err);font-size:13px;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<main>
  <h1>Generador de licencias</h1>
  <p>Pega el "código de esta tablet" que muestra la app y envía la licencia al cliente.</p>
  <label for="codigo">Código de la tablet</label>
  <input id="codigo" autocomplete="off" placeholder="K7M2Q-9XH4T" autofocus>
  <div class="err" id="err"></div>
  <div class="lic" id="lic"><b id="valor"></b><button id="copiar">Copiar</button></div>
</main>
<script>
// Mismo cálculo que licencia.js y Licencia.java
const SECRETO = '__SECRETO__';
const ALFABETO = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function base32(bytes, largo){
  let bits = 0, valor = 0, out = '';
  for (const b of bytes){
    valor = (valor << 8) | b; bits += 8;
    while (bits >= 5 && out.length < largo){ out += ALFABETO[(valor >>> (bits - 5)) & 31]; bits -= 5; }
    valor &= (1 << bits) - 1;
    if (out.length >= largo) break;
  }
  return out;
}
function normalizar(t){
  return String(t || '').toUpperCase().replace(/O/g, '0').replace(/[IL]/g, '1').replace(/[^0-9A-Z]/g, '');
}
/* SHA-256 y HMAC escritos aquí mismo: en el móvil, al abrir este archivo desde
   el gestor de archivos, el navegador no deja usar crypto.subtle. */
const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function sha256(bytes){
  const l = bytes.length, n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n);
  m.set(bytes); m[l] = 0x80;
  const bits = l * 8;
  m[n - 4] = bits >>> 24; m[n - 3] = (bits >>> 16) & 255; m[n - 2] = (bits >>> 8) & 255; m[n - 1] = bits & 255;
  const h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w = new Array(64), r = (x, s) => (x >>> s) | (x << (32 - s));
  for (let o = 0; o < n; o += 64){
    for (let i = 0; i < 16; i++) w[i] = (m[o+4*i] << 24) | (m[o+4*i+1] << 16) | (m[o+4*i+2] << 8) | m[o+4*i+3];
    for (let i = 16; i < 64; i++){
      const s0 = r(w[i-15], 7) ^ r(w[i-15], 18) ^ (w[i-15] >>> 3), s1 = r(w[i-2], 17) ^ r(w[i-2], 19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++){
      const t1 = (hh + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
    h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
  }
  const out = new Uint8Array(32);
  h.forEach((v, i) => { out[4*i] = v >>> 24; out[4*i+1] = (v >>> 16) & 255; out[4*i+2] = (v >>> 8) & 255; out[4*i+3] = v & 255; });
  return out;
}
function hmac(clave, datos){
  const k = new Uint8Array(64); k.set(clave.length > 64 ? sha256(clave) : clave);
  const ip = new Uint8Array(64 + datos.length), op = new Uint8Array(64 + 32);
  for (let i = 0; i < 64; i++){ ip[i] = k[i] ^ 0x36; op[i] = k[i] ^ 0x5c; }
  ip.set(datos, 64);
  op.set(sha256(ip), 64);
  return sha256(op);
}
function licenciaPara(codigo){
  const clave = new Uint8Array(SECRETO.match(/../g).map(h => parseInt(h, 16)));
  const firma = hmac(clave, new TextEncoder().encode('RT-LIC|' + codigo));
  return base32(firma, 12).match(/.{4}/g).join('-');
}
const $ = id => document.getElementById(id);
$('codigo').addEventListener('input', () => {
  const c = normalizar($('codigo').value);
  $('lic').className = 'lic'; $('err').textContent = '';
  if (!c) return;
  if (c.length !== 10){ $('err').textContent = 'El código tiene 10 caracteres (lleva ' + c.length + ').'; return; }
  try {
    $('valor').textContent = licenciaPara(c);
    $('lic').className = 'lic on';
  } catch (e){
    $('err').textContent = 'No se pudo calcular la licencia: ' + e.message;
  }
});
// sin portapapeles moderno (archivo abierto desde el gestor de archivos) se usa el antiguo
$('copiar').addEventListener('click', () => {
  const t = $('valor').textContent, listo = () => {
    $('copiar').textContent = 'Copiada';
    setTimeout(() => $('copiar').textContent = 'Copiar', 1500);
  };
  const antiguo = () => {
    const a = document.createElement('textarea');
    a.value = t; a.setAttribute('readonly', ''); a.style.position = 'fixed'; a.style.opacity = '0';
    document.body.appendChild(a); a.select();
    const ok = document.execCommand('copy');
    a.remove();
    if (ok) listo(); else $('err').textContent = 'No se pudo copiar: mantén pulsada la licencia para copiarla.';
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(listo, antiguo);
  else antiguo();
});
</script>
</body>
</html>
